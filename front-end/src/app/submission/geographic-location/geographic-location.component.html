<div class="w-100">
  <ng-select
    [items]="filteredCountries"
    bindLabel="name"
    bindValue="code"
    [multiple]="true"
    [disabled]="disabled"
    [compareWith]="compareCountries"
    [clearable]="false"
    [searchable]="true"
    [(ngModel)]="selectedCountryObjects[center?.code]"
    (change)="onChange($event)"
    placeholder="Select countries..."
  >
  </ng-select>
</div>
