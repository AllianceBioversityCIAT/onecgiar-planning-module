

<div>
  <ul *ngIf="data.message || data.message2" class="dialog-list">
    
    <li *ngIf="data.message">
      {{ data.message }}
    </li>

    <li *ngIf="data.message2">
      {{ data.message2 }}
    </li>
  </ul>
</div>

<mat-dialog-actions align="end">
  <button class="btn-confirm-yes" mat-raised-button (click)="onYesClick()" cdkFocusInitial>
    OK
  </button>
</mat-dialog-actions>
