<div class="budget-assumption-wrap">
  <input
    class="budget-input"
    type="text"
    inputmode="numeric"
    [ngModel]="displayValue"
    (ngModelChange)="onValueChange($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
    (paste)="onPaste($event)"
    [disabled]="disabled"
    [class.is-saving]="isSaving"
    [class.is-saved]="isSaved"
    [class.is-error]="isError"
  />

  <button
    *ngIf="assumptionEnabled"
    type="button"
    tabindex="-1"
    class="assumption-icon"
    data-tour-anchor="porb-assumption-icon"
    [ngClass]="{
      'state-disabled': iconState === 'disabled',
      'state-active': iconState === 'active',
      'state-completed': iconState === 'completed'
    }"
    [disabled]="iconState === 'disabled'"
    (click)="openAssumptionModal()"
    title="Assumption"
  >
    <mat-icon>description</mat-icon>
  </button>
</div>

<div class="assumption-modal-backdrop" *ngIf="showAssumptionModal" (click)="closeAssumptionModal()"></div>
<div class="assumption-modal" *ngIf="showAssumptionModal">
  <div class="assumption-modal-header">Assumption</div>
  <textarea
    class="assumption-textarea"
    [(ngModel)]="draftAssumption"
    placeholder="Enter assumption..."
  ></textarea>
  <div class="assumption-modal-actions">
    <button type="button" class="btn-cancel" (click)="closeAssumptionModal()">Cancel</button>
    <button type="button" class="btn-save" (click)="saveAssumption()">Save</button>
  </div>
</div>
