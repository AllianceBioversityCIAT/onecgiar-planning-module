<div class="table-box">
  <div class="table-tools" data-tour-anchor="porb-section-tools">
    <input
      class="tool-input"
      type="text"
      placeholder="Search bilateral rows"
      [(ngModel)]="search"
    />
    <select class="tool-select" [(ngModel)]="filterOutputs">
      <option value="">All Outputs</option>
      <option *ngFor="let option of outputOptions" [value]="option">{{ option }}</option>
    </select>
    <button type="button" class="export-btn" (click)="export()">Export Excel</button>
  </div>

  <div class="table-scroll">
    <table class="additional-table">
      <thead>
        <tr>
          <th>Project title</th>
          <th>High Level Output title</th>
          <th>W3/Bilateral Project (USD)</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of filteredRows; let i = index" [class.row-error]="rowHasValidationError(row)" [class.recently-updated]="isRecentlyUpdated(row)" [class.toc-updated]="isTocUpdated(row)">
          <td [class.deleted-cell]="row.toc_is_deleted">
            <span *ngIf="row.toc_is_deleted" class="deleted-badge" matTooltip="Removed from TOC">Deleted</span>
            <span *ngIf="isTocUpdated(row) && !row.toc_is_deleted" class="toc-badge" matTooltip="Recently Updated from TOC">TOC</span>
            {{ row.bilateral_name || "-" }}
          </td>
          <td
            class="row-title"
            *ngIf="isGroupedCellStart(filteredRows, i, 'bilateral_outputs')"
            [attr.rowspan]="getGroupedCellRowspan(filteredRows, i, 'bilateral_outputs')"
          >
            {{ row.bilateral_outputs || "-" }}
          </td>
          <td class="budget-cell-with-error num-cell" [class.deleted-cell]="row.toc_is_deleted">
            <app-budget-and-assumption
              [attr.data-tour-anchor]="i === 0 ? 'porb-budget-input' : null"
              [(value)]="row.bilateral_budget"
              [(assumption)]="row.bilateral_assumption"
              [disabled]="!canEdit"
              [isSaving]="savingIds.has(row.id)"
              [isError]="errorIds.has(row.id)"
              [isSaved]="savedIds.has(row.id)"
              (commit)="saveRow(row)"
              (assumptionCommit)="saveRow(row)"
              (pasteBudget)="pasteFromSpreadsheet($event, i, 'bilateral_budget', 'bilateral_assumption')"
            ></app-budget-and-assumption>
            <span
              *ngIf="rowHasValidationError(row)"
              class="row-error-icon"
              [attr.data-tour-anchor]="i === 0 ? 'porb-row-error' : null"
              matTooltip="Budget requires assumption"
              matTooltipPosition="left"
            >
              !
            </span>
            <button
              *ngIf="row.toc_is_deleted && canEdit"
              class="row-delete-btn"
              matTooltip="Remove this TOC-deleted item"
              matTooltipPosition="left"
              [disabled]="deletingIds.has(row.id)"
              (click)="deleteRow(row)"
            >
              <mat-icon>delete_outline</mat-icon>
            </button>
          </td>
        </tr>
        <tr *ngIf="!filteredRows.length">
          <td colspan="3">No data found for selected filters.</td>
        </tr>
        <tr class="subtotal-row" *ngIf="filteredRows.length">
          <td colspan="2" class="subtotal-label">Subtotal</td>
          <td class="num-cell">{{ subtotal }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
