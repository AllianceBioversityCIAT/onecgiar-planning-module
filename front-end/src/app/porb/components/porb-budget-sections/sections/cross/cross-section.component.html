<div class="table-box">
  <div class="table-tools" data-tour-anchor="porb-section-tools">
    <input
      class="tool-input"
      type="text"
      placeholder="Search item"
      [(ngModel)]="search"
    />
    <button type="button" class="export-btn" (click)="export()" [disabled]="!rows.length">
      Export Excel
    </button>
  </div>

  <div class="table-scroll" *ngIf="rows.length">
    <table class="additional-table">
      <thead>
        <tr>
          <th style="width: 55%">Cross-Cutting</th>
          <th style="width: 45%">Total budget (USD)</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of filteredRows">
          <td class="row-title">{{ row.title }}</td>
          <td class="budget-cell-with-error num-cell">
            <app-budget-and-assumption
              [attr.data-tour-anchor]="row === filteredRows[0] ? 'porb-budget-input' : null"
              [(value)]="row.budget"
              [(assumption)]="row.assumption"
              [disabled]="!canEdit"
              [isSaving]="savingIds.has(row.standerd_cross_cutting_id)"
              [isError]="errorIds.has(row.standerd_cross_cutting_id)"
              [isSaved]="savedIds.has(row.standerd_cross_cutting_id)"
              (commit)="saveRow(row)"
              (assumptionCommit)="saveRow(row)"
            ></app-budget-and-assumption>
            <span
              *ngIf="rowHasValidationError(row)"
              class="row-error-icon"
              [attr.data-tour-anchor]="row === filteredRows[0] ? 'porb-row-error' : null"
              matTooltip="Budget requires assumption"
              matTooltipPosition="left"
            >
              !
            </span>
          </td>
        </tr>

        <tr *ngIf="!filteredRows.length">
          <td colspan="2">No data found for selected filters.</td>
        </tr>
        <tr class="subtotal-row" *ngIf="filteredRows.length">
          <td class="subtotal-label">Subtotal</td>
          <td class="num-cell">{{ subtotal }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="empty-state" *ngIf="!rows.length">
    <mat-icon>info_outline</mat-icon>
    <span>No standard cross-cutting items found. Please contact an administrator.</span>
  </div>
</div>
