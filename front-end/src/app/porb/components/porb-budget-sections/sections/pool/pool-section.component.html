<div class="table-box">
  <div class="table-tools" data-tour-anchor="porb-section-tools">
    <input
      class="tool-input"
      type="text"
      placeholder="Search High Level Output"
      [(ngModel)]="search"
    />
    <select class="tool-select" [(ngModel)]="filterType">
      <option value="">All KPI Types</option>
      <option *ngFor="let option of typeOptions" [value]="option">{{ option }}</option>
    </select>
    <button type="button" class="export-btn" (click)="export()">Export Excel</button>
  </div>

  <div class="table-scroll">
    <table class="additional-table">
      <thead>
        <tr>
          <th>High Level Output</th>
          <th>Description</th>
          <th>Type</th>
          <th>Country(ies) of implementation</th>
          <th>Target</th>
          <th>Budget (USD)</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of filteredRows; let i = index" [class.row-error]="rowHasValidationError(row)" [class.new-row]="isNewRow(row)">
          <td
            class="row-title"
            *ngIf="isGroupedCellStart(filteredRows, i, 'hlo_name')"
            [attr.rowspan]="getGroupedCellRowspan(filteredRows, i, 'hlo_name')"
          >
            {{ row.hlo_name || "-" }}
          </td>
          <td [class.deleted-cell]="row.toc_is_deleted">{{ row.hlo_description || "-" }}</td>
          <td [class.deleted-cell]="row.toc_is_deleted">{{ row.hlo_type || "-" }}</td>
          <td [class.deleted-cell]="row.toc_is_deleted">{{ row.hlo_geo || "-" }}</td>
          <td class="num-cell" [class.deleted-cell]="row.toc_is_deleted">{{ row.hlo_target ?? "-" }}</td>
          <td class="budget-cell-with-error num-cell" [class.deleted-cell]="row.toc_is_deleted">
            <span *ngIf="i === 0" data-tour-anchor="porb-budget-input">
              <app-budget-and-assumption
                [(value)]="row.hlo_budget"
                [(assumption)]="row.hlo_assumption"
                [disabled]="!canEdit"
                [isSaving]="savingIds.has(row.id)"
                [isError]="errorIds.has(row.id)"
                [isSaved]="savedIds.has(row.id)"
                (commit)="saveRow(row)"
                (assumptionCommit)="saveRow(row)"
                (pasteBudget)="pasteFromSpreadsheet($event, i, 'hlo_budget', 'hlo_assumption')"
              ></app-budget-and-assumption>
            </span>
            <app-budget-and-assumption
              *ngIf="i !== 0"
              [(value)]="row.hlo_budget"
              [(assumption)]="row.hlo_assumption"
              [disabled]="!canEdit"
              [isSaving]="savingIds.has(row.id)"
              [isError]="errorIds.has(row.id)"
              [isSaved]="savedIds.has(row.id)"
              (commit)="saveRow(row)"
              (assumptionCommit)="saveRow(row)"
              (pasteBudget)="pasteFromSpreadsheet($event, i, 'hlo_budget', 'hlo_assumption')"
            ></app-budget-and-assumption>
            <span
              *ngIf="rowHasValidationError(row)"
              class="row-error-icon"
              [attr.data-tour-anchor]="i === 0 ? 'porb-row-error' : null"
              matTooltip="Budget requires assumption"
              matTooltipPosition="left"
            >
              !
            </span>
            <button
              *ngIf="row.toc_is_deleted && canEdit"
              class="row-delete-btn"
              matTooltip="Remove this TOC-deleted item"
              matTooltipPosition="left"
              [disabled]="deletingIds.has(row.id)"
              (click)="deleteRow(row)"
            >
              <mat-icon>delete_outline</mat-icon>
            </button>
          </td>
        </tr>
        <tr *ngIf="!filteredRows.length">
          <td colspan="6">No data found for selected filters.</td>
        </tr>
        <tr class="subtotal-row" *ngIf="filteredRows.length">
          <td colspan="5" class="subtotal-label">Subtotal</td>
          <td class="num-cell">{{ subtotal }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
