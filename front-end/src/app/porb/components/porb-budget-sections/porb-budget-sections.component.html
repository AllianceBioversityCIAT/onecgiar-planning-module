<section class="additional-section">
  <h2>{{ selectedExtraNavigation }}</h2>

  <!-- Section loading skeleton -->
  <ng-container *ngIf="loading">
    <div class="section-skeleton">
      <div class="section-sk-toolbar">
        <div class="skeleton-block sk-toolbar-bar sk-toolbar-bar--wide"></div>
        <div class="skeleton-block sk-toolbar-bar sk-toolbar-bar--med"></div>
        <div class="skeleton-block sk-toolbar-bar sk-toolbar-bar--narrow"></div>
      </div>
      <div class="skeleton-block sk-table-head"></div>
      <div class="skeleton-block sk-table-row"></div>
      <div class="skeleton-block sk-table-row"></div>
      <div class="skeleton-block sk-table-row"></div>
      <div class="skeleton-block sk-table-row"></div>
      <div class="skeleton-block sk-table-row"></div>
    </div>
  </ng-container>

  <ng-container *ngIf="!loading" [ngSwitch]="selectedExtraNavigation">
    <app-pool-section
      *ngSwitchCase="'Pool funding HLO'"
      [rows]="poolFundingRows"
      [canEdit]="canEdit"
      (budgetUpdated)="budgetUpdated.emit()"
    ></app-pool-section>

    <app-partners-section
      *ngSwitchCase="'Partners'"
      [rows]="partnersRows"
      [selectedCenterId]="selectedCenterId"
      [canEdit]="canEdit"
      (budgetUpdated)="budgetUpdated.emit()"
    ></app-partners-section>

    <app-w3-section
      *ngSwitchCase="'W3/Bilatral'"
      [rows]="w3Rows"
      [canEdit]="canEdit"
      (budgetUpdated)="budgetUpdated.emit()"
    ></app-w3-section>

    <app-melia-section
      *ngSwitchCase="'MELIA Study'"
      [rows]="meliaRows"
      [canEdit]="canEdit"
      (budgetUpdated)="budgetUpdated.emit()"
    ></app-melia-section>

    <app-anaplan-section
      *ngSwitchCase="'Anaplan'"
      [rows]="anaplanRows"
      [canEdit]="canEdit"
      (budgetUpdated)="budgetUpdated.emit()"
    ></app-anaplan-section>

    <app-cross-section
      *ngSwitchCase="'Cross Cutting'"
      [rows]="crossRows"
      [selectedProgramId]="selectedProgramId"
      [selectedPorbAowId]="selectedPorbAowId"
      [selectedCenterId]="selectedCenterId"
      [canEdit]="canEdit"
      (budgetUpdated)="budgetUpdated.emit()"
    ></app-cross-section>
  </ng-container>
</section>
