<section class="porb-page">
  <nav class="porb-breadcrumb">
    <a routerLink="/">Programs</a>
    <span>/</span>
    <a
      [routerLink]="[
        '/program',
        initiative?.id,
        initiative?.official_code,
        'porb'
      ]"
      >PORB</a
    >
  </nav>

  <div data-tour-anchor="porb-overview">
    <app-porb-overview
      *ngIf="initiative"
      [initiative]="initiative"
      [onlineProgramUsers]="onlineProgramUsers"
      (exportOverview)="exportOverviewExcel()"
    ></app-porb-overview>
  </div>

  <div class="porb-layout" *ngIf="!loading">
    <app-porb-sidebar
      [centers]="displayedCenters"
      [aows]="displayedAows"
      [extraNavigationItems]="extraNavigationItems"
      [selectedCenter]="selectedCenter"
      [selectedAow]="selectedAow"
      [selectedExtraNavigation]="selectedExtraNavigation"
      [selectedCenterKey]="selectedCenterKey"
      [centersCollapsed]="centersCollapsed"
      [aowsCollapsed]="aowsCollapsed"
      [completedCenterCodes]="completedCenterCodes"
      [selectedCenterCompleted]="isSelectedCenterCompleted"
      [centerStatusUpdating]="centerStatusUpdating"
      [sectionValidation]="sectionValidation"
      [centerErrorCodes]="centerErrorCodes"
      [aowErrorIds]="aowErrorIds"
      [consolidationIndicators]="consolidationIndicators"
      [consolidationBudgetSummary]="consolidationBudgetSummary"
      (toggleCenters)="toggleCentersCollapsed()"
      (toggleAows)="toggleAowsCollapsed()"
      (selectCenter)="onSelectCenter($event)"
      (selectAow)="onSelectAow($event)"
      (selectExtra)="onSelectExtraNavigation($event)"
      (toggleSelectedCenterCompletion)="onToggleSelectedCenterCompletion()"
    ></app-porb-sidebar>

    <main class="porb-content">
      <app-porb-budget-sections
        *ngIf="isPorbSelectionComplete"
        [selectedExtraNavigation]="selectedExtraNavigation"
        [selectedProgramId]="initiativeId || undefined"
        [selectedCenterId]="selectedCenterIdForSections"
        [selectedPorbAowId]="selectedPorbAowIdForSections"
        [poolFundingRows]="poolFundingRows"
        [partnersRows]="partnersRows"
        [w3Rows]="w3Rows"
        [meliaRows]="meliaRows"
        [anaplanRows]="anaplanRows"
        [crossRows]="crossRows"
        (budgetUpdated)="onBudgetUpdated()"
      ></app-porb-budget-sections>
    </main>
  </div>

  <div class="porb-skeleton" *ngIf="loading">
    <div class="skeleton-breadcrumb-row">
      <div class="skeleton-block sk-line sk-breadcrumb-a"></div>
      <div class="skeleton-block sk-line sk-breadcrumb-sep"></div>
      <div class="skeleton-block sk-line sk-breadcrumb-b"></div>
    </div>

    <div class="skeleton-overview-card">
      <div class="skeleton-overview-left">
        <div class="skeleton-block sk-chip"></div>
        <div class="skeleton-block sk-title"></div>
        <div class="skeleton-block sk-subtitle"></div>
      </div>
      <div class="skeleton-overview-right">
        <div class="skeleton-block sk-online-label"></div>
        <div class="skeleton-avatars">
          <div class="skeleton-block sk-avatar"></div>
          <div class="skeleton-block sk-avatar"></div>
          <div class="skeleton-block sk-avatar"></div>
        </div>
        <div class="skeleton-actions">
          <div class="skeleton-block sk-action"></div>
          <div class="skeleton-block sk-action"></div>
          <div class="skeleton-block sk-action"></div>
          <div class="skeleton-block sk-action"></div>
          <div class="skeleton-block sk-action"></div>
        </div>
      </div>
    </div>

    <div class="skeleton-layout">
      <div class="skeleton-sidebar">
        <div class="skeleton-nav-row">
          <div class="skeleton-panel">
            <div class="skeleton-block sk-panel-title"></div>
            <div class="skeleton-block sk-nav-item"></div>
            <div class="skeleton-block sk-nav-item"></div>
            <div class="skeleton-block sk-nav-item"></div>
            <div class="skeleton-block sk-nav-item"></div>
          </div>
          <div class="skeleton-panel">
            <div class="skeleton-block sk-panel-title"></div>
            <div class="skeleton-block sk-nav-item"></div>
            <div class="skeleton-block sk-nav-item"></div>
            <div class="skeleton-block sk-nav-item"></div>
            <div class="skeleton-block sk-nav-item"></div>
          </div>
          <div class="skeleton-panel">
            <div class="skeleton-block sk-panel-title"></div>
            <div class="skeleton-block sk-nav-item"></div>
            <div class="skeleton-block sk-nav-item"></div>
            <div class="skeleton-block sk-nav-item"></div>
            <div class="skeleton-block sk-nav-item"></div>
          </div>
        </div>
        <div class="skeleton-panel skeleton-consolidation">
          <div class="skeleton-block sk-panel-title"></div>
          <div class="skeleton-block sk-table-head"></div>
          <div class="skeleton-block sk-table-row"></div>
          <div class="skeleton-block sk-table-row"></div>
          <div class="skeleton-block sk-table-row"></div>
        </div>
      </div>

      <div class="skeleton-content-card">
        <div class="skeleton-block sk-content-title"></div>
        <div class="skeleton-content-toolbar">
          <div class="skeleton-block sk-filter"></div>
          <div class="skeleton-block sk-filter"></div>
          <div class="skeleton-block sk-filter"></div>
        </div>
        <div class="skeleton-block sk-table-head"></div>
        <div class="skeleton-block sk-table-row"></div>
        <div class="skeleton-block sk-table-row"></div>
        <div class="skeleton-block sk-table-row"></div>
        <div class="skeleton-block sk-table-row"></div>
      </div>
    </div>
  </div>

  <app-porb-tour
    [open]="showTour"
    [steps]="tourSteps"
    (closed)="onTourClosed()"
  ></app-porb-tour>
</section>
