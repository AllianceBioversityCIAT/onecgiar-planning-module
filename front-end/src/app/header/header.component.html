<header class="header-bar">
  <div class="header-bar__left">
    <a routerLink="/" class="header-bar__brand">
      <img
        src="../../assets/shared-image/mask-group.svg"
        class="header-bar__logo"
        alt="CGIAR Logo"
      />
      <span class="header-bar__title">
        <strong>PRMS</strong> Planning
      </span>
    </a>

    <nav class="header-bar__nav">
      <a
        routerLink="/"
        class="header-bar__nav-item"
        routerLinkActive="header-bar__nav-item--active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="accessHome()"
      >
        Home
      </a>
      <a
        routerLink="/budget-summary"
        class="header-bar__nav-item"
        routerLinkActive="header-bar__nav-item--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Budget Summary
      </a>
      <a
        *ngIf="user_info && isAdmin"
        routerLink="admin"
        class="header-bar__nav-item"
        routerLinkActive="header-bar__nav-item--active"
      >
        Admin Module
      </a>
      <a
        routerLink="/archive"
        class="header-bar__nav-item"
        routerLinkActive="header-bar__nav-item--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Archive
      </a>
    </nav>
  </div>

  <div class="header-bar__right">
    <span class="test-env-badge">Testing Environment</span>
    <button
      *ngIf="user_info"
      class="header-bar__user-btn"
      type="button"
    >
      <mat-icon class="header-bar__user-icon">person</mat-icon>
      <span class="header-bar__user-name">{{ user_info?.full_name }}</span>
    </button>

    <button
      *ngIf="user_info"
      class="header-bar__logout-btn"
      type="button"
      (click)="logout()"
    >
      Logout
      <mat-icon class="header-bar__logout-icon">exit_to_app</mat-icon>
    </button>

    <button
      *ngIf="!user_info"
      class="header-bar__logout-btn"
      type="button"
      (click)="login()"
    >
      Login
      <mat-icon class="header-bar__logout-icon">login</mat-icon>
    </button>
  </div>
</header>
