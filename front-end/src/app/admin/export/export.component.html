<div class="track-porbs__icon-box">
  <mat-icon class="track-porbs__icon-box__icon">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="40"
      height="30"
      viewBox="0 0 24 24"
    >
      <path
        d="M5.65951 17.6484C5.15534 17.6484 4.72389 17.4772 4.36517 17.1348C4.00584 16.7918 3.82617 16.3797 3.82617 15.8984V13.2734H5.65951V15.8984H16.6595V13.2734H18.4928V15.8984C18.4928 16.3797 18.3135 16.7918 17.9548 17.1348C17.5954 17.4772 17.1637 17.6484 16.6595 17.6484H5.65951ZM11.1595 14.1484L6.57617 9.77344L7.8595 8.50469L10.2428 10.7797V3.64844H12.0762V10.7797L14.4595 8.50469L15.7428 9.77344L11.1595 14.1484Z"
        fill="currentColor"
      />
    </svg>
  </mat-icon>
  <span class="track-porbs__icon-box__title">Export</span>
</div>

<div class="track-porbs__text-box--1">
  <p class="track-porbs__text-box__title">
    Welcome to the Export panel, here you can manage the Export table within the
    platform.
  </p>
</div>

<div class="track-porbs__content--1">
  <mat-progress-bar
    *ngIf="isExporting"
    mode="determinate"
    [value]="progressValue"
    color="accent"
    class="export-progress-bar"
  ></mat-progress-bar>
  <div class="form-container">
    <div class="search">
      <div class="sec-1">
        <div class="user-management__main__text-box">
          <mat-form-field appearance="outline">
            <mat-label>Select a phase</mat-label>
            <mat-select
              [(ngModel)]="selectedPhase"
              (selectionChange)="onPhaseChange($event.value)"
            >
              <mat-option *ngFor="let phase of phases" [value]="phase">
                {{ phase.name }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
      <div class="sec-2">
        <div class="user-management__main__text-box">
          <mat-form-field appearance="outline">
            <mat-label>Select a status</mat-label>
            <mat-select
              [(ngModel)]="selectedStatus"
              (selectionChange)="onStatusChange($event.value)"
            >
              <mat-option *ngFor="let status of statusOptions" [value]="status">
                {{ status }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>

      <div class="sec-5"></div>
      <div class="sec-6"></div>
      <div class="sec-9"></div>

      <div class="risk-report-button-box">
        <div class="sec-7">
          <div class="risk-report-button-box btn-sec">
            <button
            *ngIf="downloadReady"
            mat-raised-button
            color="primary"
            class="risk-report-button-box__btn btn--success"
            (click)="downloadFile()"
          >
            <mat-icon>download</mat-icon>
            Download
          </button>
            <button
              class="risk-report-button-box__btn btn--chestnut"
              mat-raised-button
              [disabled]="!initiatives.length  || isExporting"
              (click)="exportData()"
              [ngClass]="{ disabled: !initiatives.length  || isExporting }"
            >
              <mat-icon class="create-risk-1">
                <svg
                  class="risk-management-export-box-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  width="22"
                  height="21"
                  viewBox="0 0 22 21"
                  fill="none"
                >
                  <path
                    d="M5.65951 17.6484C5.15534 17.6484 4.72389 17.4772 4.36517 17.1348C4.00584 16.7918 3.82617 16.3797 3.82617 15.8984V13.2734H5.65951V15.8984H16.6595V13.2734H18.4928V15.8984C18.4928 16.3797 18.3135 16.7918 17.9548 17.1348C17.5954 17.4772 17.1637 17.6484 16.6595 17.6484H5.65951ZM11.1595 14.1484L6.57617 9.77344L7.8595 8.50469L10.2428 10.7797V3.64844H12.0762V10.7797L14.4595 8.50469L15.7428 9.77344L11.1595 14.1484Z"
                    fill="white"
                  />
                </svg>
              </mat-icon>
              <span class="user-management__button-box__title">{{
                isExporting ? "Exporting..." : "Export Excel"
              }}</span>
            </button>

   
          </div>

          <div class="risk-report-button-box"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="table-box mat-elevation-z8">
    <table mat-table matSort [dataSource]="dataSource">
      <tr
        class="table-header"
        mat-header-row
        *matHeaderRowDef="columnsToDisplay"
      ></tr>
      <tr
        class="table-header"
        mat-row
        *matRowDef="let myRowData; columns: columnsToDisplay"
      ></tr>

      <ng-container matColumnDef="official_code">
        <th mat-header-cell *matHeaderCellDef>
          <span class="h1 th-1-m">Program ID</span>
        </th>
        <td mat-cell *matCellDef="let element">{{ element.official_code }}</td>
      </ng-container>

      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>
          <span>Program Title</span>
        </th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">
          {{ element.latest_submission?.status || "N/A" }}
        </td>
      </ng-container>
    </table>
    <div class="glossary-content-container element-management-paginator-box">
      <mat-paginator
        [pageSizeOptions]="[100]"
        [length]="length"
        [pageIndex]="pageIndex - 1"
        (page)="pagination($event)"
        aria-label="Select page of Export"
      ></mat-paginator>
    </div>
  </div>
</div>
