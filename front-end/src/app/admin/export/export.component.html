<div class="track-porbs__icon-box">
  <mat-icon class="track-porbs__icon-box__icon">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="40"
      height="30"
      viewBox="0 0 24 24"
    >
      <path
        d="M5.65951 17.6484C5.15534 17.6484 4.72389 17.4772 4.36517 17.1348C4.00584 16.7918 3.82617 16.3797 3.82617 15.8984V13.2734H5.65951V15.8984H16.6595V13.2734H18.4928V15.8984C18.4928 16.3797 18.3135 16.7918 17.9548 17.1348C17.5954 17.4772 17.1637 17.6484 16.6595 17.6484H5.65951ZM11.1595 14.1484L6.57617 9.77344L7.8595 8.50469L10.2428 10.7797V3.64844H12.0762V10.7797L14.4595 8.50469L15.7428 9.77344L11.1595 14.1484Z"
        fill="currentColor"
      />
    </svg>
  </mat-icon>
  <span class="track-porbs__icon-box__title">Export PORB</span>
</div>

<div class="track-porbs__text-box--1">
  <p class="track-porbs__text-box__title">
    Export PORB data for programs. Select a phase and status to filter, then export all matching programs as a ZIP.
  </p>
</div>

<div class="track-porbs__content--1">
  <mat-progress-bar
    *ngIf="isExporting"
    mode="determinate"
    [value]="progressValue"
    color="accent"
    class="export-progress-bar"
  ></mat-progress-bar>

  <div class="filter-bar">
    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Phase</mat-label>
      <mat-select
        [(ngModel)]="selectedPhase"
        (selectionChange)="onPhaseChange($event.value)"
      >
        <mat-option *ngFor="let phase of phases" [value]="phase">
          {{ phase.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Status</mat-label>
      <mat-select
        [(ngModel)]="selectedStatus"
        (selectionChange)="onStatusChange($event.value)"
      >
        <mat-option *ngFor="let status of statusOptions" [value]="status">
          {{ status }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <div class="filter-bar__actions">
      <button
        *ngIf="downloadReady"
        mat-raised-button
        color="primary"
        class="action-btn action-btn--download"
        (click)="downloadFile()"
      >
        <mat-icon>download</mat-icon>
        Download
      </button>
      <button
        mat-raised-button
        class="action-btn action-btn--export"
        [disabled]="!initiatives.length || isExporting"
        (click)="exportData()"
      >
        <mat-icon>file_download</mat-icon>
        {{ isExporting ? "Exporting..." : "Export Excel" }}
      </button>
      <button
        mat-raised-button
        class="action-btn action-btn--export"
        [disabled]="!initiatives.length || isExportingBudget"
        (click)="exportBudgetSummary()"
      >
        <mat-icon>table_view</mat-icon>
        {{ isExportingBudget ? "Exporting..." : "Export Budget Summary" }}
      </button>
      <button
        mat-raised-button
        class="action-btn action-btn--export"
        [disabled]="!initiatives.length || isExportingAnaplan"
        (click)="exportAnaplanSummary()"
      >
        <mat-icon>summarize</mat-icon>
        {{ isExportingAnaplan ? "Exporting..." : "Export Anaplan Summary" }}
      </button>
    </div>
  </div>

  <div class="table-box mat-elevation-z8" #pdfcontent>
    <table mat-table matSort [dataSource]="dataSource">
      <tr
        class="table-header"
        mat-header-row
        *matHeaderRowDef="columnsToDisplay"
      ></tr>
      <tr
        class="table-header"
        mat-row
        *matRowDef="let myRowData; columns: columnsToDisplay"
      ></tr>

      <ng-container matColumnDef="official_code">
        <th mat-header-cell *matHeaderCellDef>
          <span>Program ID</span>
        </th>
        <td mat-cell *matCellDef="let element">{{ element.official_code }}</td>
      </ng-container>

      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>
          <span>Program Title</span>
        </th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">
          {{ element.status || "N/A" }}
        </td>
      </ng-container>
    </table>
    <div class="glossary-content-container element-management-paginator-box">
      <mat-paginator
        [pageSizeOptions]="[100]"
        [length]="length"
        [pageIndex]="pageIndex - 1"
        (page)="pagination($event)"
        aria-label="Select page of Export"
      ></mat-paginator>
    </div>
  </div>
</div>
